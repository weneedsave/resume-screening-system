[project]
name = "hr"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "docx2pdf>=0.1.8",#把 .docx 文件转成 .pdf
    "docx2txt>=0.9",#从 .docx 文件中提取纯文本
    "fastapi>=0.136.0",#构建 Web API 的现代 Python 框架，自动生成 API 文档（Swagger UI）
    "flask>=3.1.3",#轻量级 Web 框架
    "lxml>=6.1.0",#解析 XML 和 HTML 的底层库
    "numpy>=2.4.4",#科学计算核心库
    "openai>=2.32.0",#调用 OpenAI 的 API
    "paddleocr>=3.4.1",#百度出品的 OCR 引擎，识别图片中的文字
    "paddlepaddle>=3.3.1",#为 paddleocr 提供神经网络计算能力。相当于 PyTorch 之于某些 OCR 库的关系。
    "pdf2image>=1.17.0",#把 PDF 每一页转成图片
    "pdfplumber>=0.11.9",#从 PDF 中提取文字和表格
    "pillow>=12.2.0",#打开、修改、保存各种图片格式。OCR 前常用它做图片预处理
    "pymupdf>=1.27.2.3",#高性能 PDF 全功能库（也叫 Fitz），能提取文本、图片、注释，还能渲染页面、合并拆分 PDF。速度很快，功能比 pdfplumber 更全面但表格解析稍弱。
    "pytesseract>=0.3.13",#Google Tesseract OCR 的 Python 接口
    "python-docx>=1.2.0",#创建和修改 Word 文档
    "python-multipart>=0.0.26",#FastAPI 或 Starlette 收到用户上传的文件时，全靠它来解析表单数据。没有它，文件上传接口跑不通。
    "rapidocr-onnxruntime>=1.4.4",#不依赖深度学习框架（不像 PaddleOCR 依赖 PaddlePaddle），直接基于 ONNX Runtime 推理。部署简单、启动快，功能和 PaddleOCR 有重叠。
    "requests>=2.33.1",#调用外部 API 的标配库。比如内部调用 OpenAI API，或者请求其他微服务都要用它。
    "streamlit>=1.56.0",#快速搭建数据应用界面
    "uvicorn>=0.44.0",#用来运行 FastAPI 应用，支持高并发
    "werkzeug>=3.1.8",#Flask 底层用它处理请求和响应。如果项目用 Flask 做 Web 服务，它就必不可少。
]
